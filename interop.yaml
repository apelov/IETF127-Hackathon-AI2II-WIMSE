# Maurice is the implementation under test; its model-family provenance is unknown.
# The client adapter was written mainly with OpenAI Codex; later edits (A6b request,
# journal matching for mixed-credentials) were made by Anthropic Claude. The capture checker was
# separately authored with OpenRouter Nemotron Ultra via claude-or.
experiment: wimse-inbound-maurice
env_checks:
  - name: prepared-local-maurice
    command: .venv/bin/python setup/check_env.py
peers:
  - name: maurice
    path: .
    family: unknown-maurice
    under_test: true
    build: .venv/bin/python setup/build_server.py
    binaries: [bin/maurice]
    start: .venv/bin/python setup/run_server.py
    ready: {command: ".venv/bin/python setup/check_ready.py", timeout_s: 30}
  - name: wimse-client
    path: .
    family: openai
    under_test: true
    start: .venv/bin/python peers/driver.py --journal-out {bundle}/decision-journal.jsonl
capture: {interface: loopback, filter: "tcp port 5050 or tcp port 47999"}
cells:
  - name: inbound
    server: maurice
    clients: [wimse-client]
    checkers: [observes-wimse]
    timeout_s: 120
checkers:
  - name: observes-wimse
    family: nvidia
    observes_capture: true
    command: .venv/bin/python checkers/observes_wimse.py {capture}
    inputs: []
    negatives:
      - {input: checkers/negatives/unrelated.pcap, replaces: "{capture}"}
      - {input: checkers/negatives/request_only.pcap, replaces: "{capture}"}
      - {input: checkers/negatives/forbidden_fetch.pcap, replaces: "{capture}"}
